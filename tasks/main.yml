---
- name: Remove apt-packaged certbot
  ansible.builtin.apt:
    name: [certbot, python3-certbot-nginx, python3-certbot-apache]
    state: absent
  when: certbot_remove_apt_package
  tags: [certbot]

- name: Install snapd
  ansible.builtin.apt:
    name: snapd
    state: present
    update_cache: true
    cache_valid_time: 3600
  tags: [certbot]

- name: Install certbot snap
  community.general.snap:
    name: certbot
    classic: true
    channel: "{{ certbot_snap_channel }}"
  tags: [certbot]

- name: Link certbot into PATH
  ansible.builtin.file:
    src: /snap/bin/certbot
    dest: "{{ certbot_link }}"
    state: link
    force: true
  tags: [certbot]

- name: Make sure the renew timer is enabled
  ansible.builtin.systemd_service:
    name: snap.certbot.renew.timer
    enabled: true
    state: started
  when: not ansible_check_mode
  tags: [certbot]
